<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | Radio Command Center</title>
    <link rel="stylesheet" href="/static/css/style.css?v=20260721-5" />
  </head>
  <body class="login-body">
    <main class="login-shell">
      <section class="login-card" aria-labelledby="login-title">
        <div class="login-mark"><span class="live-pulse"></span></div>
        <p class="login-eyebrow">Secure operations access</p>
        <h1 id="login-title">Radio Command Center</h1>
        <p class="login-copy">Sign in to view live radio transcripts and recordings.</p>
        <form id="login-form">
          <label for="login-username">Username</label>
          <input id="login-username" name="username" autocomplete="username" required />
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required />
          <button class="btn btn-primary login-submit" type="submit">Sign in securely</button>
          <p id="login-error" class="login-error" role="alert" hidden></p>
        </form>
        <div class="login-security-note">Encrypted local connection · Session expires after 12 hours</div>
      </section>
    </main>
    <script src="/static/js/login.js?v=20260721-5"></script>
  </body>
</html>
